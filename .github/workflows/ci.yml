name: Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ripgrep (used by the secret scan in the gate)
        run: command -v rg >/dev/null || (sudo apt-get update && sudo apt-get install -y ripgrep)
      - run: npm ci
      - run: bash scripts/run_gate.sh
