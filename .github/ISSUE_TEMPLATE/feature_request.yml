name: Feature request
description: Suggest a change or addition
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: What are you trying to do?, description: The situation, not the solution. }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: What would help? }
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options: [Glasses display, Phone companion, SDK / providers, Docs, Other]
